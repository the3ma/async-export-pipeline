# Root of the Python uv workspace (services/shared, services/api, services/worker).
# The root itself is a virtual project: it is never built or installed, it only pins the
# shared toolchain (ruff, mypy, pytest) and pulls every member into one lock file / venv.
[project]
name = "async-export-pipeline"
version = "0.1.0"
description = "Workspace root for the export pipeline Python services"
requires-python = ">=3.12,<3.13"
dependencies = ["exportkit", "export-api", "export-worker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/shared", "services/api", "services/worker"]

[tool.uv.sources]
exportkit = { workspace = true }
export-api = { workspace = true }
export-worker = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[dynamodb,s3,sqs]>=5.0",
    "mypy>=1.11",
    "openpyxl>=3.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "infra"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "RET", "TID"]
ignore = [
    "S101", # assert is fine in tests
    "S608", # SQL is built from fixed fragments only; values are always bound parameters
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["exportkit", "export_api", "export_worker"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
files = ["services/shared/src", "services/api/src", "services/worker/src"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*", "xlsxwriter", "xlsxwriter.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["services/shared/tests", "services/api/tests", "services/worker/tests"]
markers = ["integration: needs a real PostgreSQL (set DATABASE_URL); skipped otherwise"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Third-party deprecations outside our control:
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:There is no current event loop:DeprecationWarning:mangum",
]
