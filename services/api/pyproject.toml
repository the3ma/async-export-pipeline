[project]
name = "export-api"
version = "0.1.0"
description = "HTTP API: activity grid, export jobs and audited downloads"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exportkit",
    "fastapi>=0.115",
    "mangum>=0.17",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
exportkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
