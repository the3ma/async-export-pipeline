version: 2
# Minor and patch updates arrive grouped (safe to merge together); each major update gets its own
# PR so one breaking change never blocks the rest.
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /infra
    schedule: { interval: weekly }
    groups:
      infra-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ["/services/api", "/services/worker", "/web"]
    schedule: { interval: weekly }
    ignore:
      # Node: stay on LTS lines (even majors); odd releases are short-lived.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x"]
      # Python: the services target 3.12 (pyproject requires-python).
      - dependency-name: python
        update-types: [version-update:semver-minor]
