name: Deploy

# Build once, publish the artifacts, deploy exactly those artifacts.
# Only the repository owner's pushes deploy (branch protection on private repos needs a paid plan);
# everyone else's pushes still run CI. Without an AWS role configured the deploy job is skipped and
# the run stays green - this repository is a reference implementation.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: CDK stage to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false # never interrupt a running deployment

env:
  STAGE: ${{ inputs.stage || 'dev' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-artifacts:
    name: Build Lambda artifacts
    needs: ci
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
      - name: Build worker + api zips
        run: |
          infra/scripts/build-lambda-artifact.sh worker
          infra/scripts/build-lambda-artifact.sh api
          (cd infra/.build && sha256sum ./*.zip | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-artifacts-${{ github.sha }}
          path: infra/.build/
          retention-days: 30
      - name: Summary
        run: |
          {
            echo "### Lambda artifacts"
            echo '```'
            cat infra/.build/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-images:
    name: Publish image (${{ matrix.name }})
    needs: ci
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: services/api/Dockerfile }
          - { name: worker, context: ., file: services/worker/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: CDK deploy
    needs: build-artifacts
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'dev' }} # protect "prod" with required reviewers in the repo settings
    permissions:
      contents: read
      id-token: write # OIDC - no long-lived AWS keys
    env:
      AWS_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: AWS not configured
        if: env.AWS_ROLE == ''
        run: |
          {
            echo "### Deploy skipped"
            echo "Set the repository variable \`AWS_DEPLOY_ROLE_ARN\` (an IAM role that trusts GitHub OIDC) to deploy."
            echo "The Lambda artifacts and container images were built and published."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.AWS_ROLE != ''
      - uses: actions/download-artifact@v4
        if: env.AWS_ROLE != ''
        with:
          name: lambda-artifacts-${{ github.sha }}
          path: infra/.build/
      - name: Verify artifact checksums
        if: env.AWS_ROLE != ''
        run: cd infra/.build && sha256sum -c SHA256SUMS
      - uses: aws-actions/configure-aws-credentials@v6
        if: env.AWS_ROLE != ''
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-node@v4
        if: env.AWS_ROLE != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Deploy the published artifacts
        if: env.AWS_ROLE != ''
        working-directory: infra
        run: |
          npm ci
          npx cdk deploy --require-approval never -c stage="$STAGE" \
            -c workerArtifact=.build/worker.zip -c apiArtifact=.build/api.zip
